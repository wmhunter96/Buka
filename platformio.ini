; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32-c3-devkitm-1

[env:esp32-c3-devkitm-1]
; Arduino-ESP32 3.x (ESP_I2S + rgbLedWrite); official PIO platform stays on 2.x
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino

monitor_speed = 115200

lib_deps =
    adafruit/Adafruit PWM Servo Driver Library
    adafruit/Adafruit GFX Library
    adafruit/Adafruit SSD1306
    bblanchon/ArduinoJson@^7.4.3

build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D SSD1306_NO_SPLASH

board_build.partitions = partitions.csv
board_build.filesystem = littlefs

; Empty keeps assets/. Set to a mods/<name> folder to overlay its WAVs
; (example: halloween). Clips the mod does not ship stay stock.
custom_audio_mod =

extra_scripts =
    pre:scripts/firmware_version.py
    pre:scripts/copy_assets.py
    pre:scripts/embed_ui.py
    pre:scripts/park_servos_before_upload.py
    post:scripts/upload_fs_after_upload.py

; Host Unity tests — never flash. Run: pio test -e native
test_ignore = *

; Opt-in Wi-Fi updates: two OTA app slots instead of coredump, and 960 KB LittleFS.
[env:ota]
extends = env:esp32-c3-devkitm-1
board_build.partitions = partitions_ota.csv
build_flags =
    ${env:esp32-c3-devkitm-1.build_flags}
    -D TE_OTA
extra_scripts =
    ${env:esp32-c3-devkitm-1.extra_scripts}
    post:scripts/ota.py

; Classic ESP32 DevKit (ESP32-WROOM-32, 4 MB) instead of the C3-Zero.
; No native USB: Serial goes through the board's USB-UART bridge, so the
; USB-CDC flags are dropped. Pin map: TE_BOARD_ESP32_DEVKIT in include/pins.h.
; TE_OLED_128X64: 0.96" 128x64 SSD1306 panel instead of the 0.91" 128x32.
; Delete that line to go back to the stock OLED.
; Build: pio run -e esp32-devkit
[env:esp32-devkit]
extends = env:esp32-c3-devkitm-1
board = esp32dev
build_flags =
    -D TE_BOARD_ESP32_DEVKIT
    -D TE_OLED_128X64
    -D SSD1306_NO_SPLASH

; Buka: ESP32 DevKit on a Goma (Sesame) DevKit carrier. Servos straight from
; GPIO on the carrier's servo headers, no PCA9685; 0.96" 128x64 OLED on J3.
; Wiring: docs/hardware/goma-carrier.md
; Build: pio run -e buka
[env:buka]
extends = env:esp32-devkit
build_flags =
    ${env:esp32-devkit.build_flags}
    -D TE_SERVO_DIRECT

[env:native]
platform = native
test_framework = unity
test_build_src = true
build_src_filter =
    -<**/*.*>
    +<settings/validate.cpp>
    +<settings/wifi_network_list.cpp>
    +<display/eyes/styles/eye_style_ids.cpp>
    +<audio/wav_parser.cpp>
    +<audio/audio_motion.cpp>
    +<serial/frame.cpp>
    +<serial/protocol.cpp>
build_flags = -std=c++17 -Iinclude -Isrc

; Opt-in OLED-only application. Building does not upload or change robot settings.
[env:expression-demo]
platform = ${env:esp32-c3-devkitm-1.platform}
board = ${env:esp32-c3-devkitm-1.board}
framework = ${env:esp32-c3-devkitm-1.framework}
monitor_speed = ${env:esp32-c3-devkitm-1.monitor_speed}
build_flags = ${env:esp32-c3-devkitm-1.build_flags}
; For an upside-down OLED, append: -D EXPRESSION_DEMO_ROTATION=2
lib_deps =
    adafruit/Adafruit GFX Library
    adafruit/Adafruit SSD1306
build_src_filter =
    -<*>
    +<../examples/expression-demo/main.cpp>
test_ignore = *
